<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dokumenty Szkoły i Przedszkola - SP w Jaszczowie</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #1e3a8a; --primary-light: #2563eb; --accent: #d97706; --accent-hover: #b45309;
            --bg-main: #f0f7ff; --card-bg: #ffffff; --text-dark: #0f172a; --text-muted: #475569; --border-color: #e2e8f0;
            --shadow: 0 10px 25px -5px rgba(37, 99, 235, 0.1);
        }
        body.dark-theme {
            --primary: #60a5fa; --primary-light: #3b82f6; --accent: #fbbf24; --accent-hover: #d97706;
            --bg-main: #0f172a; --card-bg: #1e293b; --text-dark: #f8fafc; --text-muted: #94a3b8; --border-color: #334155;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: var(--bg-main); color: var(--text-dark); min-height: 100vh; padding: 2rem 1.5rem; }
        .wrapper { max-width: 900px; margin: 0 auto; }
        
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; }
        .btn-back { display: inline-flex; align-items: center; gap: 8px; background: var(--card-bg); color: var(--primary); border: 2px solid var(--border-color); padding: 0.6rem 1.2rem; border-radius: 12px; font-weight: 700; text-decoration: none; transition: all 0.2s ease; }
        .btn-back:hover { background: var(--primary); color: #fff; }
        
        .doc-page-card { background: var(--card-bg); border-radius: 24px; border: 1px solid var(--border-color); padding: 2.5rem; box-shadow: var(--shadow); }
        .doc-page-title { font-family: 'Cinzel', serif; color: var(--primary); font-size: 1.8rem; margin-bottom: 0.5rem; text-align: center; }
        .doc-page-subtitle { color: var(--text-muted); text-align: center; margin-bottom: 2rem; }
        
        .doc-list { list-style: none; display: flex; flex-direction: column; gap: 1rem; }
        .doc-item-row { display: flex; justify-content: space-between; align-items: center; background: var(--bg-main); border: 1px solid var(--border-color); border-radius: 14px; padding: 1rem 1.4rem; gap: 15px; }
        .doc-title-text { font-weight: 700; font-size: 1rem; color: var(--text-dark); word-break: break-word; }
        .doc-actions-group { display: flex; gap: 10px; flex-shrink: 0; }
        
        .btn-doc { font-size: 0.85rem; padding: 0.5rem 1rem; border-radius: 8px; font-weight: 700; text-decoration: none; display: inline-flex; align-items: center; gap: 5px; }
        .btn-view-tab { background: var(--primary-light); color: #fff; }
        .btn-download-tab { background: var(--accent); color: #fff; }

        @media (max-width: 600px) {
            .doc-item-row { flex-direction: column; align-items: flex-start; }
            .doc-actions-group { width: 100%; justify-content: flex-end; }
        }
    </style>
</head>
<body>
    <div class="wrapper">
        <div class="top-bar">
            <a href="index.html" class="btn-back">&#8592; Strona Główna</a>
            <h3 style="font-family: 'Cinzel', serif; color: var(--primary);">Szkoła & Przedszkole</h3>
        </div>

        <div class="doc-page-card">
            <h1 class="doc-page-title">🏫 Dokumenty Szkoły i Przedszkola</h1>
            <p class="doc-page-subtitle">Wszystkie bieżące regulaminy, wykazy podręczników i dokumenty do pobrania lub podglądu:</p>

            <ul class="doc-list" id="listContainerSchool">
                <li class="doc-item-row">
                    <span class="doc-title-text">&#128196; Wykaz_Podrecznikow_2026_2027.pdf</span>
                    <div class="doc-actions-group">
                        <a href="pliki_pdf/Wykaz_Podrecznikow_2026_2027.pdf" target="_blank" rel="noopener" class="btn-doc btn-view-tab">&#128065; Podgląd</a>
                        <a href="pliki_pdf/Wykaz_Podrecznikow_2026_2027.pdf" download class="btn-doc btn-download-tab">&#128190; Pobierz</a>
                    </div>
                </li>
            </ul>
        </div>
    </div>

    <script>
        if (localStorage.getItem('theme') === 'dark') { document.body.classList.add('dark-theme'); }

        function renderPdfList(folder, containerId, files) {
            if (!Array.isArray(files) || files.length === 0) return;
            const container = document.getElementById(containerId);
            if (!container) return;

            const safeFiles = files.filter(name =>
                typeof name === 'string' &&
                name.toLowerCase().endsWith('.pdf') &&
                !name.includes('/') &&
                !name.includes('\\') &&
                !name.includes('..')
            );
            if (safeFiles.length === 0) return;

            container.textContent = '';
            safeFiles.forEach(fileName => {
                const filePath = `${folder}/${encodeURIComponent(fileName)}`;

                const li = document.createElement('li');
                li.className = 'doc-item-row';

                const titleSpan = document.createElement('span');
                titleSpan.className = 'doc-title-text';
                titleSpan.textContent = `📄 ${fileName}`;

                const actionsDiv = document.createElement('div');
                actionsDiv.className = 'doc-actions-group';

                const viewLink = document.createElement('a');
                viewLink.href = filePath;
                viewLink.target = '_blank';
                viewLink.rel = 'noopener noreferrer';
                viewLink.className = 'btn-doc btn-view-tab';
                viewLink.textContent = '👁 Podgląd';

                const downloadLink = document.createElement('a');
                downloadLink.href = filePath;
                downloadLink.setAttribute('download', '');
                downloadLink.className = 'btn-doc btn-download-tab';
                downloadLink.textContent = '💾 Pobierz';

                actionsDiv.appendChild(viewLink);
                actionsDiv.appendChild(downloadLink);
                li.appendChild(titleSpan);
                li.appendChild(actionsDiv);
                container.appendChild(li);
            });
        }

        fetch('pliki_pdf/list.json', { cache: 'no-store' })
            .then(response => {
                if (!response.ok) throw new Error('Brak pliki_pdf/list.json');
                return response.json();
            })
            .then(files => renderPdfList('pliki_pdf', 'listContainerSchool', files))
            .catch(err => console.log(err.message));
    </script>
</body>
</html>
